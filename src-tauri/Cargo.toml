[package]
name = "epilens"
version = "0.1.0"
description = "sEEG electrode implantation planner on a 3D brain"
authors = ["Miles <milesjmahon@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
