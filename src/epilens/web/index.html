<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>epilens</title>
    <link rel="stylesheet" href="planner.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js",
          "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="main">
        <div id="tabs"></div>
        <div id="viewer">
        <div id="stage">
          <div id="labels"></div>
          <div id="views"></div>
          <div id="display">
            <label title="Cortex opacity"
              >Brain
              <input
                type="range"
                id="hull"
                name="hull"
                min="0"
                max="1"
                step="0.05"
                value="0.5"
            /></label>
            <label title="Deep brain structures opacity"
              >Deep structures
              <input
                type="range"
                id="deep"
                name="deep"
                min="0"
                max="1"
                step="0.05"
                value="0.5"
            /></label>
            <label title="Slice views"
              >Slice
              <select id="slice">
                <option value="">Off</option>
                <option value="axial">Axial</option>
                <option value="coronal">Coronal</option>
                <option value="sagittal">Sagittal</option>
                <option value="probe">Probe's eye</option>
                <option value="along">View along</option>
              </select>
              <input
                type="range"
                id="sliceAt"
                name="sliceAt"
                title="Move the slice (mm from the target)"
                min="-90"
                max="90"
                step="1"
                value="0"
                hidden
              />
            </label>
            <button id="sliceFlip" title="Flip the slice view" hidden>
              Flip
            </button>
            <button id="split" title="Show 2D sections beside the 3D view">
              2D
            </button>
          </div>
          <div id="tip"></div>
          <div id="offline" hidden></div>
        </div>
        <div id="sections" hidden></div>
        </div>
        <div id="bar">
          <div id="pick" hidden></div>
          <div id="readAs"></div>
          <input
            id="cmd"
            autocomplete="off"
            spellcheck="false"
            placeholder='Describe an electrode as entry, target, e.g. "temporal pole, anterior amygdala" or "STG RHH"'
          />
        </div>
      </div>
      <aside id="side">
        <div class="top">
          <button id="menuBtn" title="Settings">☰</button>
          <span class="brand">epilens</span>
          <button id="exportBtn">Export CSV</button>
        </div>
        <div id="menu" hidden></div>
        <h2>Electrodes</h2>
        <div id="list"></div>
      </aside>
    </div>
    <script type="module">
      const fail = (e) =>
        document.body.insertAdjacentHTML(
          "beforeend",
          `<pre class="err">${e.stack || e}</pre>`,
        );
      window.addEventListener("error", (e) => fail(e.error || e.message));
      import("./main.js").catch(fail);
    </script>
  </body>
</html>
